<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buku Tamu Digital</title>
    <style>
        /* Gaya Umum/Reset */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            /* Latar belakang bernuansa pink keunguan gelap */
            background-color: #1e132b;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Tampilan Kartu (Card) */
        .card {
            background: #2a1b3d;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(216, 27, 96, 0.25);
            padding: 30px;
            width: 100%;
            max-width: 400px;
            text-align: center; /* Teks berada di tengah */
            border: 1px solid #4a285d;
        }

        .card h2 {
            margin-bottom: 8px;
            color: #ff65a3; /* Warna Pink Cerah */
            font-size: 24px;
        }

        .card p {
            color: #d1b3e0;
            font-size: 14px;
            margin-bottom: 24px;
        }

        /* Form dan Group Input */
        .form-group {
            margin-bottom: 18px;
            text-align: left; /* Label tetap rata kiri agar mudah dibaca */
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: #f3d5ff;
            font-weight: 600;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #4a285d;
            border-radius: 8px;
            background-color: #38234c;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .form-group input::placeholder,
        .form-group textarea::placeholder {
            color: #a382b3;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: #ff65a3; /* Sorotan warna pink saat mengetik */
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        /* Tombol Menarik */
        .btn-submit {
            width: 100%;
            padding: 12px;
            /* Gradien Warna Pink Keunguan */
            background: linear-gradient(135deg, #ff65a3, #8a2be2);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            margin-top: 10px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(255, 101, 163, 0.5);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .btn-submit:disabled {
            background: #555555;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
    </style>
</head>
<body>

    <!-- Komponen Kartu (Card) -->
    <div class="card">
        <h2>Buku Tamu Digital</h2>
        <p>Silakan isi formulir di bawah ini</p>

        <form id="guestbookForm">
            <div class="form-group">
                <label for="nama">Nama kamu</label>
                <input type="text" id="nama" name="nama" placeholder="Masukkan nama Anda..." required>
            </div>

            <div class="form-group">
                <label for="pesan">Pesan kamu</label>
                <textarea id="pesan" name="pesan" placeholder="Tuliskan pesan Anda..." required></textarea>
            </div>

            <button type="submit" id="submitBtn" class="btn-submit">Kirim Pesan</button>
        </form>
    </div>

    <!-- Script JavaScript untuk Menghubungkan ke Google Sheets -->
    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbw4PTwyPNHTeQFG26ei-gpQJZB6a_Es1SlVyBou8n6t6YPYyaroKJdUWcIjGDhjVg30/exec';
        const form = document.getElementById('guestbookForm');
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', e => {
            e.preventDefault();
            
            // Ubah teks tombol saat proses pengiriman
            submitBtn.disabled = true;
            submitBtn.textContent = 'Mengirim...';

            fetch(scriptURL, { method: 'POST', body: new FormData(form)})
                .then(response => {
                    alert('Permintaan pengiriman telah dilakukan. Periksa Google Sheets untuk memastikan data tersimpan.');
                    form.reset();
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Kirim Pesan';
                })
                .catch(error => {
                    console.error('Error!', error.message);
                    alert('Terjadi kesalahan saat mengirim pesan.');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Kirim Pesan';
                });
        });
    </script>

</body>
</html>
