<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buku Digital</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #fce4ec;
  margin: 0;
  padding: 20px;
}
.container {
  max-width: 500px;
  margin: auto;
  background: white;
  padding: 25px;
  border-radius: 15px;
  box-shadow: 0 4px 12px #d9a8bb;
}
h1 {
  text-align: center;
  color: #d63384;
}
p {
  color: #666;
}
.intro {
  text-align: center;
}
label {
  display: block;
  margin-top: 15px;
  font-weight: bold;
}
input {
  width: 100%;
  padding: 12px;
  margin-top: 7px;
  box-sizing: border-box;
  border: 1px solid #ddd;
  border-radius: 8px;
}
button {
  width: 100%;
  padding: 12px;
  margin-top: 15px;
  border: none;
  border-radius: 8px;
  background: #e83e8c;
  color: white;
  font-size: 16px;
  cursor: pointer;
}
button:disabled {
  opacity: 0.6;
}
.pesanan {
  background: #fff0f6;
  padding: 12px;
  border-radius: 8px;
  margin-top: 12px;
  overflow-wrap: anywhere;
}
</style>
</head>

<body>
<div class="container">
  <h1>📚 Buku Digital</h1>
  <p class="intro">Silakan isi nama dan tanggal pemesanan.</p>

  <form id="formPesanan">
    <label for="nama">Nama Pemesan</label>
    <input type="text" id="nama"
      placeholder="Masukkan nama lengkap" required>

    <label for="tanggal">Tanggal Pesan</label>
    <input type="date" id="tanggal" required>

    <button type="submit" id="tombol">
      Simpan Pesanan
    </button>
  </form>

  <h3>📖 Daftar Pesanan</h3>
  <div id="daftar"></div>
</div>

<script>
const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbykTGplkwHevkWGrXt6XPLfZaogAVzPIlp6lIOVuwH4MRyeglxGBWxir7vhWKOzQa7KeA/exec";

const form = document.getElementById("formPesanan");
const daftar = document.getElementById("daftar");
const tombol = document.getElementById("tombol");

let pesanan = JSON.parse(
  localStorage.getItem("pesananBuku") || "[]"
);

function tampilkanPesanan() {
  daftar.innerHTML = "";

  if (pesanan.length === 0) {
    daftar.textContent = "Belum ada pesanan.";
    return;
  }

  pesanan.forEach(function(item) {
    const kartu = document.createElement("div");
    kartu.className = "pesanan";

    const nama = document.createElement("strong");
    nama.textContent = "Nama: " + item.nama;

    const tanggal = document.createElement("p");
    tanggal.textContent = "Tanggal pesan: " + item.tanggal;

    kartu.append(nama, tanggal);
    daftar.appendChild(kartu);
  });
}

form.addEventListener("submit", async function(e) {
  e.preventDefault();

  const nama = document.getElementById("nama").value.trim();
  const tanggal = document.getElementById("tanggal").value;

  if (!nama || !tanggal) {
    alert("Nama dan tanggal wajib diisi.");
    return;
  }

  tombol.disabled = true;
  tombol.textContent = "Mengirim...";

  try {
    await fetch(SCRIPT_URL, {
      method: "POST",
      mode: "no-cors",
      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      },
      body: JSON.stringify({
        nama: nama,
        tanggal: tanggal
      })
    });

    const dataBaru = { nama, tanggal };
    pesanan.unshift(dataBaru);

    localStorage.setItem(
      "pesananBuku",
      JSON.stringify(pesanan)
    );

    tampilkanPesanan();
    form.reset();

    alert(
      "Data telah dikirim. Periksa Google Spreadsheet untuk memastikan data masuk."
    );

  } catch (error) {
    alert("Pengiriman gagal. Periksa koneksi internet.");
  } finally {
    tombol.disabled = false;
    tombol.textContent = "Simpan Pesanan";
  }
});

tampilkanPesanan();
</script>
</body>
</html>
